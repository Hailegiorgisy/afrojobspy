[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afrojobspy"
version = "0.1.0"
description = "A custom job scraper module for African platforms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/hailegiorigsy/afrojobspy"